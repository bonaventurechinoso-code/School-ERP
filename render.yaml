services:
  - type: web
    name: school-erp
    runtime: node
    branch: main
    autoDeploy: true
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: node scripts/pre-deploy-fix.js && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DEMO_DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        value: https://bonaveeict.com.ng
      - key: NEXT_PUBLIC_APP_URL
        value: https://bonaveeict.com.ng
