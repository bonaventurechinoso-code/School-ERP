# ==============================================================================
# Multi-Tenant School ERP - Nginx Wildcard SSL & SNI Reverse Proxy Configuration
# ==============================================================================
# Fixes 'ERR_SSL_UNRECOGNIZED_NAME_ALERT' by using wildcard SSL server blocks
# that accept all dynamically registered subdomains and pass the exact Host header.
# ==============================================================================

# Redirect HTTP to HTTPS for all tenant subdomains and apex
server {
    listen 80;
    listen [::]:80;
    server_name bonaveeict.com.ng *.bonaveeict.com.ng;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Reverse Proxy Block for Wildcard Subdomains
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bonaveeict.com.ng *.bonaveeict.com.ng;

    # Wildcard SSL Certificates
    ssl_certificate /etc/letsencrypt/live/bonaveeict.com.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bonaveeict.com.ng/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Essential headers for Multi-Tenant Next.js Middleware
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time responsiveness
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
